name: Publish action

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Publish Minecraft Mods Fabric
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          curseforge-id: 574123
          modrinth-id: k3lrwGqk
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            fabric/build/libs/!(*-@(javadoc|sources)).jar
            fabric/build/libs/*-@(javadoc|sources).jar
          version-type: beta
          loaders: fabric
          game-versions: 1.21.1
          java: 21
          name: ""
          changelog: "https://github.com/Buuz135/DarkModeEverywhere/commits/1.21"

      - name: Publish Minecraft Mods NeoForge
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          curseforge-id: 574123
          modrinth-id: k3lrwGqk
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            neoforge/build/libs/!(*-@(javadoc|sources)).jar
            neoforge/build/libs/*-@(javadoc|sources).jar
          version-type: beta
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          name: ""
          changelog: "https://github.com/Buuz135/DarkModeEverywhere/commits/1.21"
